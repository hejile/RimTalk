[package]
name = "rust-agent"
version = "0.1.0"
edition = "2024"

[lib]
crate-type=["cdylib"]

[dependencies]
ai-api-types = { git = "https://github.com/hejile/ai-api-types.git" }
log = "0.4.29"
reqwest = "0.13.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["full"] }
